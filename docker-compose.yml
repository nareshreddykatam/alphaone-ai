version: "3.8"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: alphaone
      POSTGRES_PASSWORD: alphaone_dev
      POSTGRES_DB: alphaone
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
    working_dir: /app
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
