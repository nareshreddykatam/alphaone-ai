[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alphaone"
version = "0.1.0"
description = "AlphaOne BTC AI - AI-powered BTC/USDT perpetual futures trading intelligence"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.29",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "redis[hiredis]>=5.0.0",
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "ta>=0.11.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.3.0",
    "joblib>=1.3.0",
    "python-dotenv>=1.0.0",
    "python-telegram-bot>=21.0",
    "telethon>=1.36.0",
    "ccxt>=4.2.0",
    "websockets>=12.0",
    "structlog>=24.1.0",
    "python-socketio[asyncio-client]>=5.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["apps", "database", "ml", "services"]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "pre-commit>=3.7.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
strict = true
